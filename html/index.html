<!DOCTYPE html>
<html lang="en">
<head>
	<title>Document</title>
</head>
<body>
	<main id="app"></main>
  <script>
    const app = document.getElementById('app');
    const urlParams = new URLSearchParams(window.location.search);
    const slug = urlParams.get('slug');
    if (slug === null) {
      app.innerHTML = '<h1>Go to any page</h1>';
      return;
    }
    app.innerHTML = `<h1>${slug}</h1>`;
  </script>
</body>
</html>
